name: Release on merge to master

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only run when the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists, skipping. Bump the version in package.json to publish a new release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm install

      - name: Build and package
        if: steps.check.outputs.exists == 'false'
        run: npm run build && npx electron-builder --win --config --publish never

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          {
            if [ -n "$PR_BODY" ]; then
              printf '%s\n\n' "$PR_BODY"
            fi
            echo "_Released from #${PR_NUMBER}_"
          } > release-notes.md

          gh release create "$VERSION" dist/*.zip \
            --target "$MERGE_SHA" \
            --title "Update $VERSION" \
            --notes-file release-notes.md
